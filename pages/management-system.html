<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경영시스템 - 두발로 대시보드</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <link href="../assets/css/common.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        mark { background: #fde68a; padding: 0 1px; }
        .doc h1 { font-size: 1.5rem; font-weight: 700; margin: 1.2rem 0 .8rem; }
        .doc h2 { font-size: 1.2rem; font-weight: 700; margin: 1.4rem 0 .6rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .2rem; }
        .doc h3 { font-size: 1.05rem; font-weight: 600; margin: 1rem 0 .4rem; }
        .doc h4 { font-size: 1rem; font-weight: 600; margin: .8rem 0 .3rem; color: #374151; }
        .doc p { margin: .35rem 0; line-height: 1.7; }
        .doc ul, .doc ol { margin: .4rem 0 .4rem 1.4rem; line-height: 1.7; }
        .doc ul { list-style: disc; } .doc ol { list-style: decimal; }
        .doc table { border-collapse: collapse; margin: .6rem 0; font-size: .9rem; width: 100%; }
        .doc th, .doc td { border: 1px solid #d1d5db; padding: .3rem .5rem; vertical-align: top; }
        .doc th { background: #f3f4f6; }
        .doc hr { margin: 1rem 0; }
        .doc code { background: #f3f4f6; padding: 0 .25rem; }
        .doc pre { background: #f9fafb; border: 1px solid #e5e7eb; padding: .6rem .8rem; overflow-x: auto; font-size: .85rem; line-height: 1.5; }
        .doc details { margin: 1rem 0; } .doc summary { cursor: pointer; color: #6b7280; font-size: .9rem; }
        .ch table { border-collapse: collapse; width: 100%; font-size: .9rem; }
        .ch th, .ch td { border-bottom: 1px solid #e5e7eb; padding: .4rem .5rem; text-align: left; vertical-align: top; }
        .ch th { color: #6b7280; font-weight: 500; font-size: .8rem; }
        @media print {
            nav, footer, #homePanel, #chapterPanel, #docToolbar, .no-print { display: none !important; }
            body { background: #fff; }
            main { max-width: none; padding: 0; }
            #docPanel { display: block !important; box-shadow: none; border: 0; }
            .print-header { display: flex !important; }
            @page { size: A4; margin: 18mm 16mm; }
        }
        .print-header { display: none; justify-content: space-between; border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 12px; font-size: 12px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="text-sm">
                <a href="../index.html" class="text-gray-500 hover:underline">두발로 대시보드</a>
                <span class="text-gray-300 mx-2">/</span>
                <a href="#" id="homeLink" class="text-lg font-semibold text-gray-900">경영시스템</a>
                <span id="crumb" class="text-gray-500"></span>
            </div>
            <div class="text-xs text-gray-500" id="regMeta"></div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6">

        <section id="homePanel">
            <div class="bg-white rounded-lg shadow-sm border p-4 mb-6">
                <div class="flex gap-2">
                    <input id="searchInput" type="search" placeholder="전체 문서 검색" autocomplete="off"
                           class="flex-1 border rounded px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button id="searchClear" class="px-3 py-2 border rounded text-sm text-gray-600 hover:bg-gray-50">지우기</button>
                </div>
                <div id="searchStatus" class="text-xs text-gray-500 mt-2"></div>
                <div id="searchResults" class="mt-3 divide-y"></div>
            </div>

            <div class="mb-3 flex items-baseline justify-between">
                <h2 class="text-lg font-semibold">(통합)경영시스템</h2>
                <span id="rolesLine" class="text-xs text-gray-500"></span>
            </div>
            <div id="chapterCards" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            <p id="outsideLine" class="text-xs text-gray-400 mt-4"></p>
        </section>

        <section id="chapterPanel" class="hidden">
            <div id="chapterBody" class="ch bg-white rounded-lg shadow-sm border p-6"></div>
        </section>

        <section id="docPanel" class="bg-white rounded-lg shadow-sm border p-6 hidden">
            <div class="print-header">
                <span id="phNumber"></span><span id="phTitle"></span><span id="phRev"></span>
            </div>
            <div id="docToolbar" class="flex items-center justify-between mb-4 text-sm">
                <button id="backBtn" class="text-emerald-700 hover:underline">뒤로</button>
                <div class="flex gap-3 items-center">
                    <span id="docMeta" class="text-xs text-gray-500"></span>
                    <button id="printBtn" class="px-3 py-1 border rounded text-gray-700 hover:bg-gray-50">인쇄 / PDF</button>
                </div>
            </div>
            <article id="docBody" class="doc"></article>
        </section>

    </main>

    <footer class="bg-white border-t mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <p class="text-center text-gray-500 text-sm">두발로(주) 경영시스템. 규정은 이 페이지가 원본, 현장 지침은 노션이 원본, 기록은 폼·노션·시트.</p>
        </div>
    </footer>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/management-system.js?v=20261005c"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
