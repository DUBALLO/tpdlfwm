<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연구소 - 두발로 대시보드</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../assets/css/common.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        details > summary { cursor: pointer; list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before { content: '▸'; display: inline-block; width: 1em; color: #9ca3af; }
        details[open] > summary::before { content: '▾'; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="text-sm">
                <a href="../index.html" class="text-gray-500 hover:underline">두발로 대시보드</a>
                <span class="text-gray-300 mx-2">/</span>
                <a href="./progress.html" class="text-gray-500 hover:underline">경영시스템</a>
                <span class="text-gray-300 mx-2">/</span>
                <span class="text-lg font-semibold text-gray-900">연구소</span>
            </div>
            <div class="text-xs text-gray-500" id="updated"></div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6" id="root"></main>
    <p id="error" class="hidden max-w-6xl mx-auto px-4 text-sm text-red-600"></p>

    <footer class="bg-white border-t mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <p class="text-center text-gray-500 text-sm">© 2025 두발로 대시보드. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
    (function () {
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const shortDate = d => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };

        const link = (url, text) => url
            ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="hover:underline">${esc(text)}</a>`
            : esc(text);
        const BADGE = { '진행': 'bg-emerald-50 text-emerald-700', '선정': 'bg-emerald-50 text-emerald-700', '평가중': 'bg-yellow-50 text-yellow-700',
                        '신청': 'bg-sky-50 text-sky-700', '예정': 'bg-yellow-50 text-yellow-700', '참관': 'bg-purple-50 text-purple-700' };
        const badge = st => st ? `<span class="text-xs px-2 py-0.5 rounded shrink-0 ${BADGE[st] || 'bg-gray-100 text-gray-500'}">${esc(st)}</span>` : '';

        const head = (title, count) => `<h2 class="text-base font-bold text-gray-900 mb-3">${title}${count != null ? ` <span class="text-gray-400 font-normal text-sm">${count}</span>` : ''}</h2>`;
        const kanban = (color, inner) => `<div class="bg-white rounded-lg shadow-sm border-t-4 ${color} p-5">${inner}</div>`;
        const pair = (left, right) => `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 items-start"><div>${left}</div><div>${right}</div></div>`;

        // 제목 + 토글. 펼칠 내용이 없으면 토글 없이 제목만.
        const item = (title, url, status, body) => body
            ? `<details class="py-2">
                   <summary class="flex items-center gap-3"><span class="flex-1 font-medium text-gray-900">${link(url, title)}</span>${badge(status)}</summary>
                   <div class="ml-4 mt-1">${body}</div>
               </details>`
            : `<div class="py-2 flex items-center justify-between gap-3"><span class="flex-1 font-medium text-gray-900 pl-7">${link(url, title)}</span>${badge(status)}</div>`;

        const reportList = list => (list && list.length)
            ? `<ul class="text-sm space-y-1">${list.map(r => `<li>${link(r.url, r.title)}</li>`).join('')}</ul>` : '';

        const sections = (secs, open = true) => (secs || []).map(x => `
            <details class="mt-1" ${open ? 'open' : ''}>
                <summary class="text-sm text-gray-700">${esc(x.label)} <span class="text-gray-400">${x.items.length}</span></summary>
                <ol class="text-sm list-decimal ml-9 mt-1 space-y-1 text-gray-700">${x.items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>
            </details>`).join('');

        function render(d) {
            document.getElementById('updated').textContent = `갱신 ${d.updated}`;
            const out = [];
            const c = d.criteria;

            out.push(pair(
                head('To Do') + `<ul class="bg-white rounded-lg shadow-sm border-l-4 border-amber-400 divide-y">${(d.todo || []).map(t => `<li class="px-4 py-2.5 text-sm">${esc(t)}</li>`).join('')}</ul>`,
                head(link(c.url, c.title)) + `<div class="bg-white rounded-lg shadow-sm border border-purple-200 p-5">${sections(c.sections, false)}</div>`
            ));

            out.push(pair(
                head('연구과제', d.tasks.length) + kanban('border-emerald-500', `<div class="divide-y">${d.tasks.map(t => item(t.title, t.url, t.status, reportList(t.reports))).join('')}</div>`),
                head('비즈니스 아이디어', d.ideas.length) + kanban('border-orange-400', `<div class="divide-y">${d.ideas.map(i => item(i.title, i.url, i.status, sections(i.sections))).join('')}</div>`)
            ));

            // 지원사업: 선정 건은 맨 위, 나머지는 최신순, 합쳐 10건
            const sup = [...d.supports].sort((x, y) => ((y.status === '선정') - (x.status === '선정')) || String(y.date || '').localeCompare(String(x.date || ''))).slice(0, 10);
            const rows = list => `<div class="divide-y">${list.map(x => `<div class="py-2 flex items-center justify-between gap-3 text-sm"><span class="text-gray-800">${link(x.url, x.name)}</span>${badge(x.status)}</div>`).join('')}</div>`;
            out.push(pair(
                head('지원사업', d.supports.length) + kanban('border-sky-400', rows(sup)),
                head('박람회', d.expos.length) + kanban('border-yellow-400', rows(d.expos))
            ));

            out.push(`<p class="text-sm"><a href="${esc(d.reportsDb)}" target="_blank" rel="noopener" class="text-emerald-700 hover:underline">연구보고서 전체 (노션)</a></p>`);
            document.getElementById('root').innerHTML = out.join('');
        }

        fetch('../docs/lab.json', { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(render)
            .catch(e => {
                const el = document.getElementById('error');
                el.textContent = `연구소 데이터를 불러오지 못했습니다 (${e.message}).`;
                el.classList.remove('hidden');
            });
    })();
    </script>
</body>
</html>
